name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Fetch Reference Assemblies
        run: mise run fetch-tags

      - name: Run Unit Tests
        run: mise run test

      - name: Build Project
        run: mise run build

      - name: Package Release
        run: mise run package

      - name: Determine Release Tag and Upstream Version
        id: release_info
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "main" ] || [ "$tag" = "master" ]; then
            tag="v1.0.0-$(date +'%Y%m%d%H%M%S')"
          fi

          tech_version=""
          if [ -f "lib/.tag" ]; then
            tech_version="$(cat lib/.tag | tr -d '\r\n ')"
          fi
          if [ -z "$tech_version" ]; then
            tech_version="latest"
          fi

          echo "Release tag: $tag"
          echo "Technitium version: $tech_version"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "tech_version=$tech_version" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: FilterType ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/FilterTypeApp.zip
          body: |
            > **Built against Technitium DNS Server version:** `${{ steps.release_info.outputs.tech_version }}`

            ### Installation Instructions
            1. Download `FilterTypeApp.zip` from the release assets below.
            2. Open the Technitium DNS Web Console.
            3. Go to **Apps** → **Install App** → choose `FilterTypeApp.zip`.
            4. Configure your blocked zones and types in `dnsApp.config`.
