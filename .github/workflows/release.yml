name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Fetch Reference Assemblies
        run: mise run fetch-tags

      - name: Run Unit Tests
        run: mise run test

      - name: Determine Release Version and Upstream
        id: release_info
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          version="$(echo "$version" | tr -d '\r\n ')"

          if [ -z "$version" ]; then
            echo "::error::Release version is required."
            exit 1
          fi

          if [[ "$version" =~ ^[vV] ]]; then
            echo "::error::Version must not start with 'v' (got: '$version'). Use format like '1.0.0'."
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format '$version'. Version must follow SemVer (e.g. 1.0.0 or 1.0.0-beta.1)."
            exit 1
          fi

          tech_version=""
          if [ -f "lib/.tag" ]; then
            tech_version="$(cat lib/.tag | tr -d '\r\n ')"
          fi
          if [ -z "$tech_version" ]; then
            tech_version="latest"
          fi

          echo "Release version: $version"
          echo "Technitium version: $tech_version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tech_version=$tech_version" >> $GITHUB_OUTPUT

      - name: Build and Package Release
        run: mise run package ${{ steps.release_info.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.version }}
          name: FilterType ${{ steps.release_info.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/FilterTypeApp.zip
          body: |
            > **Built against Technitium DNS Server version:** `${{ steps.release_info.outputs.tech_version }}`

            ### Installation Instructions
            1. Download `FilterTypeApp.zip` from the release assets below.
            2. Open the Technitium DNS Web Console.
            3. Go to **Apps** → **Install App** → choose `FilterTypeApp.zip`.
            4. Configure your blocked zones and types in `dnsApp.config`.
